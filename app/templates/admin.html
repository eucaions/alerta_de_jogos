<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Painel Admin - Mapeamento de Times</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">⚙️ Dicionário de Times</h1>
                <p class="text-gray-400 text-sm mt-1">Gerencie os nomes para evitar quebras no Scraping</p>
            </div>
            <a href="/" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium border border-gray-700 transition-colors">
                📺 Ver Jogos
            </a>
        </header>

        <div class="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-gray-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-750 text-gray-400 text-xs uppercase border-b border-gray-700">
                        <th class="px-6 py-4">Nome Oficial (API)</th>
                        <th class="px-6 py-4">Nome Traduzido (Mapeamento Scraper)</th>
                        <th class="px-6 py-4 text-right">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-times" class="divide-y divide-gray-700">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarTimes() {
            try {
                const response = await fetch('/api/times');
                const data = await response.json();
                const times = data.times;
                
                const tabela = document.getElementById('tabela-times');
                tabela.innerHTML = '';

                times.forEach(time => {
                    const linha = `
                        <tr class="hover:bg-gray-700/30 transition-colors">
                            <td class="px-6 py-4 font-medium text-gray-200">
                                ${time.api_name}
                            </td>
                            <td class="px-6 py-4" colspan="2">
                                <form action="/api/times/atualizar" method="POST" class="flex items-center justify-between w-full">
                                    <input type="hidden" name="time_id" value="${time.id}">
                                    <input type="text" name="common_name" value="${time.common_name}" 
                                        placeholder="Ex: bragantino" 
                                        class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm w-64 focus:outline-none focus:border-blue-500 text-gray-100">
                                    
                                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition-colors cursor-pointer">
                                        Salvar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    `;
                    tabela.innerHTML += linha;
                });
            } catch (error) {
                console.error("Erro ao carregar times:", error);
            }
        }

        carregarTimes();
    </script>
</body>
</html>
